server:
  address: 127.0.0.1
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:linkscale}
    username: ${POSTGRES_USER:linkscale_user}
    password: ${POSTGRES_PASSWORD:linkscale_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

linkscale:
  dev-mode:
    allow-unauthenticated: true
