spring:
  application:
    name: linkscale-backend
  threads:
    virtual:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 250ms
      timeout: 250ms
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

linkscale:
  redirect-cache:
    enabled: ${LINKSCALE_REDIRECT_CACHE_ENABLED:false}
  base-url: http://localhost:8080
  dev-mode:
    allow-unauthenticated: false
    fixture-email: dev@linkscale.local
  generator:
    code-length: 8
    max-retries: 5

