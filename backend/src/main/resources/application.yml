spring:
  application:
    name: linkscale-backend
  threads:
    virtual:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

linkscale:
  base-url: http://localhost:8080
  dev-mode:
    allow-unauthenticated: false
    fixture-email: dev@linkscale.local
  generator:
    code-length: 8
    max-retries: 5

