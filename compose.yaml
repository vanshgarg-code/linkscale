services:
  postgres:
    image: postgres:17.11-alpine
    container_name: linkscale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkscale}
      POSTGRES_USER: ${POSTGRES_USER:-linkscale_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkscale_secret}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - linkscale_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkscale_user} -d ${POSTGRES_DB:-linkscale}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  linkscale_pgdata:

